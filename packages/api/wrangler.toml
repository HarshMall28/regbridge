name = "regbridge-api"
main = "src/server.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[placement]
region = "aws:eu-west-2"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
